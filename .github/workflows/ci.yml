name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
        env:
          POSTGRES_DB: parcelvault_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready --health-interval 2s
          --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: '2026.11.3'
          cache: false
      - name: Scan Git history for credentials
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="--all"
      - run: mise run check
      - name: Exercise PostgreSQL storage
        env:
          PARCELVAULT_TEST_POSTGRES_DSN: postgres://postgres@127.0.0.1:${{ job.services.postgres.ports[5432] }}/parcelvault_test?sslmode=disable
        run: mise exec -- go test -race -count=1 ./internal/database
      - name: Reject invalid configuration without logging its value
        run: |
          exit_code=0
          PARCELVAULT_LOG_LEVEL=invalid-config-marker ./bin/parcelvault 2>"$RUNNER_TEMP/config-error.json" || exit_code=$?
          test "$exit_code" = 1
          jq -e '.level == "ERROR" and (.reason | contains("log_level"))' "$RUNNER_TEMP/config-error.json"
          if grep -qF invalid-config-marker "$RUNNER_TEMP/config-error.json"; then exit 1; fi
      - name: Check for known Go vulnerabilities
        run: mise run vuln
      - name: Build Linux images for AMD64 and ARM64
        run: |
          docker buildx create --driver docker-container --name parcelvault-ci
          docker buildx build --builder parcelvault-ci --platform linux/amd64,linux/arm64 --output type=oci,dest="$RUNNER_TEMP/parcelvault.tar" .
      - name: Exercise the Compose deployment
        run: |
          docker compose up --build --wait --wait-timeout 90
          curl -fsS http://127.0.0.1:8080/healthz | jq -e '. == {"status":"ok"}'
          curl -fsS http://127.0.0.1:8080/readyz | jq -e '. == {"status":"ready"}'
          curl -fsS http://127.0.0.1:8080/api/v1/version | jq -e '. == {"version":"0.0.1"}'
          id=$(docker compose ps -q parcelvault)
          docker compose stop parcelvault
          test "$(docker inspect --format '{{.State.ExitCode}}' "$id")" = 0
          docker compose logs parcelvault | grep -F '"msg":"shutdown complete"'
      - if: always()
        run: docker compose down
